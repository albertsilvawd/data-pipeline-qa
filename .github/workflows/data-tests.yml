name: Data pipeline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline, tests and quality report
        run: bash scripts/run_quality_checks.sh

      - name: Publish quality report to the job summary
        if: always()
        run: cat reports/data_quality_report.md >> "$GITHUB_STEP_SUMMARY"
